<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ & Bản Đồ - AzureTech Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Thư viện Azure Maps -->
    <link href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" rel="stylesheet" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
</head>
<body>
    <!-- Navbar (Giữ nguyên) -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-cloud"></i>
                <span>AzureTech</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Trang Chủ</a>
                <a href="products.html">Sản Phẩm</a>
                <a href="contact.html" class="active">Liên Hệ</a>
                <a href="warranty.html">Bảo Hành AI</a>
                <div class="user-menu">
                    <a href="login.html"><img src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff" style="border-radius:50%" alt="Avatar"></a>
                </div>
            </nav>
        </div>
    </header>

    <section class="section container" style="margin-top: 40px;">
        <div class="section-header text-center">
            <h2><i class="fa-solid fa-map-location-dot"></i> Hệ Thống Cửa Hàng (Azure Maps)</h2>
            <p>Tìm chi nhánh AzureTech gần bạn nhất với dữ liệu bản đồ thời gian thực.</p>
        </div>

        <!-- Khung chứa bản đồ Azure -->
        <div style="width: 100%; height: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 40px;">
            <div id="myMap" style="width: 100%; height: 100%;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content text-center">
            <p>&copy; 2026 AzureTech Store. Cloud Computing Project.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // Code kích hoạt Azure Maps
        window.onload = function () {
            try {
                // Nhắc team Azure cung cấp Subscription Key dán vào đây!
                var map = new atlas.Map('myMap', {
                    center: [106.6297, 10.8231], // Tọa độ mặc định (TP.HCM)
                    zoom: 12,
                    view: 'Auto',
                    authOptions: {
                        authType: 'subscriptionKey',
                        subscriptionKey: 'DÁN_KEY_AZURE_MAPS_CỦA_NHÓM_VÀO_ĐÂY'
                    }
                });

                // Đợi bản đồ load xong thì ghim vị trí cửa hàng
                map.events.add('ready', function () {
                    var marker = new atlas.HtmlMarker({
                        color: '#3b82f6',
                        text: 'AzureTech',
                        position: [106.6297, 10.8231]
                    });
                    map.markers.add(marker);
                });
            } catch (error) {
                console.error("Lỗi khởi tạo Azure Maps. Vui lòng kiểm tra lại Key:", error);
                document.getElementById('myMap').innerHTML = `<div style="padding:40px; text-align:center; color:#ef4444; font-weight:bold;">Vui lòng dán Subscription Key của Azure Maps vào code để hiển thị bản đồ!</div>`;
            }
        };
    </script>
</body>
</html>
