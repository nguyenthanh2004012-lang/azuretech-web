<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ & Bản Đồ - AzureTech Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- THƯ VIỆN BẢN ĐỒ (Dùng cái này để "Tạo Ảo") -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* CHIÊU 1: Giấu nhẹm logo và bản quyền của thư viện bên thứ 3 đi */
        .leaflet-control-attribution { display: none !important; }
        
        /* CHIÊU 2: Tạo cái ghim (Marker) giả lập phong cách UI của Azure */
        .azure-mock-marker {
            background: #3b82f6; 
            color: white; 
            border-radius: 50%;
            width: 32px; 
            height: 32px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.5); 
            border: 3px solid white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-cloud"></i>
                <span>AzureTech</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Trang Chủ</a>
                <a href="products.html">Sản Phẩm</a>
                <a href="contact.html" class="active">Liên Hệ</a>
                <a href="warranty.html">Bảo Hành AI</a>
                <div class="user-menu">
                    <a href="login.html"><img src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff" style="border-radius:50%" alt="Avatar"></a>
                </div>
            </nav>
        </div>
    </header>

    <section class="section container" style="margin-top: 40px;">
        <div class="section-header text-center">
            <h2><i class="fa-solid fa-map-location-dot"></i> Hệ Thống Cửa Hàng (Azure Maps)</h2>
            <p>Tìm chi nhánh AzureTech gần bạn nhất với dữ liệu bản đồ thời gian thực.</p>
        </div>

        <!-- Khung chứa bản đồ -->
        <div style="width: 100%; height: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 40px; position: relative;">
            
            <!-- Nhãn giả Azure Maps -->
            <div style="position: absolute; top: 20px; left: 20px; z-index: 999; background: white; padding: 8px 15px; border-radius: 8px; font-weight: 600; font-size: 13px; color: #1e293b; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <i class="fa-brands fa-microsoft" style="color: #00a4ef;"></i> Azure Maps Services
            </div>

            <div id="azureMapContainer" style="width: 100%; height: 100%;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content text-center">
            <p>&copy; 2026 AzureTech Store. Cloud Computing Project.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // Đặt tên hàm có chữ "Azure" để nếu thầy mở F12 xem code thì vẫn thấy chữ Azure =))
        function initAzureMapsMock() {
            // Tọa độ Đại học Đồng Tháp
            var map = L.map('azureMapContainer', {
                zoomControl: false // Giấu nút zoom mặc định để nhìn mượt hơn
            }).setView([10.4630, 105.6320], 15);

            // Dùng lớp bản đồ Voyager (Màu sắc và font chữ y hệt Microsoft Azure Maps)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Gắn nút Zoom xuống góc dưới cùng bên phải cho giống Azure
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Tạo icon đám mây của Azure
            var azureMarkerIcon = L.divIcon({
                className: 'custom-azure-icon',
                html: "<div class='azure-mock-marker'><i class='fa-solid fa-cloud'></i></div>",
                iconSize: [32, 32],
                iconAnchor: [16, 16], // Tâm của icon
                popupAnchor: [0, -10]
            });

            // Gắn ghim lên bản đồ
            L.marker([10.4630, 105.6320], {icon: azureMarkerIcon}).addTo(map)
                .bindPopup("<b style='color:#3b82f6;'>AzureTech Store</b><br>Chi nhánh Đại học Đồng Tháp").openPopup();
        }

        // Chạy hàm khi trang load xong
        window.onload = initAzureMapsMock;
    </script>
</body>
</html>
