<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - AzureTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f7 0%, #dbeafe 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .login-card h2 { margin-bottom: 8px; font-size: 1.8rem; color: #0f172a; }
        .login-card p { color: #475569; margin-bottom: 20px; font-size: 0.9rem; }
        
        /* Tab chuyển đổi Đăng Nhập / Đăng Ký */
        .auth-tabs {
            display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1; padding: 10px; border: none; background: transparent; font-weight: 600;
            cursor: pointer; border-radius: 8px; color: #64748b; transition: all 0.3s;
        }
        .auth-tab.active {
            background: white; color: #2563eb; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; color: #1e293b; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px;
            outline: none; font-size: 0.95rem; color: #0f172a; background: #f8fafc;
            box-sizing: border-box; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #2563eb; background: white; }
        .btn-primary {
            background: #2563eb; color: white; cursor: pointer; width: 100%; padding: 14px;
            border-radius: 12px; border: none; font-weight: 600; font-size: 1rem;
            transition: background 0.3s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-sso {
            background: white; border: 1px solid #cbd5e1; color: #1e293b; width: 100%; padding: 12px;
            border-radius: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 16px; cursor: pointer; transition: background 0.3s;
        }
        .btn-sso:hover { background: #f8fafc; }
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #94a3b8; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        #auth-status { margin-top: 12px; font-size: 0.9rem; font-weight: 600; min-height: 20px; }
        
        .form-container { display: none; }
        .form-container.active { display: block; }
        
        /* Chỉnh style ô nhập OTP */
        #login-otp { letter-spacing: 8px; font-size: 1.2rem; text-align: center; font-weight: bold; }
    </style>
    <script type="text/javascript" src="https://js.monitor.azure.com/scripts/b/ai.2.min.js"></script>
    <script type="text/javascript">
      var appInsights = window.appInsights || {};
      appInsights = new Microsoft.ApplicationInsights.ApplicationInsights({
        config: {
          connectionString: "InstrumentationKey=527385f7-8098-4444-a678-5fb269ed9d3b;IngestionEndpoint=https://southeastasia-1.in.applicationinsights.azure.com/;LiveEndpoint=https://southeastasia.livediagnostics.monitor.azure.com/;ApplicationId=a867bae4-d929-4042-b6bb-872c89ad8b69"
        }
      });
      appInsights.loadAppInsights();
      appInsights.trackPageView();
    </script>
</head>
<body>
    
    <div class="login-card">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-cloud" style="font-size: 2rem; margin-right: 8px; color: #2563eb;"></i>
            <span style="font-size: 1.8rem; font-weight: 700;">AzureTech</span>
        </a>
        <h2>Hệ Thống Xác Thực</h2>
        <p>Quản lý định danh (Microsoft Entra ID & B2C)</p>
        
        <div class="auth-tabs" id="tabs-container">
            <button class="auth-tab active" onclick="switchTab('login')">Đăng Nhập</button>
            <button class="auth-tab" onclick="switchTab('register')">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="login-form" class="form-container active">
            <!-- Bước 1: Nhập mật khẩu -->
            <div id="login-step-1">
                <div class="form-group">
                    <label>Email đăng nhập</label>
                    <input type="email" id="login-email" placeholder="Nhập email của bạn...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="btn-primary" id="btn-login">Kiểm tra thông tin</button>
            </div>

            <!-- Bước 2: Nhập OTP (Bảo mật 2 lớp) - Ẩn lúc đầu -->
            <div id="login-step-2" style="display: none;">
                <div class="form-group">
                    <label style="color: #10b981; text-align: center; margin-bottom: 15px;"><i class="fa-solid fa-shield-check"></i> Mã xác thực đã được gửi đến email của bạn!</label>
                    <input type="text" id="login-otp" placeholder="••••••" maxlength="6">
                </div>
                <button class="btn-primary" id="btn-verify-otp" style="background: #10b981;"><i class="fa-solid fa-unlock"></i> Xác nhận OTP</button>
                <button type="button" style="background: transparent; border: none; color: #64748b; font-weight: 600; cursor: pointer; margin-top: 15px;" onclick="backToLoginStep1()">Quay lại</button>
            </div>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div id="register-form" class="form-container">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="reg-name" placeholder="Nhập họ tên đầy đủ...">
            </div>
            <div class="form-group">
                <label>Email đăng ký</label>
                <input type="email" id="reg-email" placeholder="Nhập email của bạn...">
            </div>
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu bảo mật...">
            </div>
            <button class="btn-primary" id="btn-register" style="background: #10b981;">Tạo Tài Khoản</button>
        </div>

        <p id="auth-status"></p>
        
        <div id="social-login">
            <div class="divider">HOẶC</div>
            <!-- ĐÃ SỬA THEO YÊU CẦU CỦA TÚ: Đổi nút <button> thành thẻ <a> chứa link Microsoft -->
            <a href="https://login.microsoftonline.com/799a10df-adf8-40a1-8f81-e94b29f318d7/oauth2/v2.0/authorize?client_id=2f3b28b0-2750-4157-aefb-9ebca70fa9b2&response_type=id_token&redirect_uri=https://mango-mud-091da3100.7.azurestaticapps.net/login.html&scope=openid&response_mode=fragment&nonce=demo123" class="btn-sso" style="text-decoration: none;">
                <i class="fa-brands fa-microsoft" style="color: #00a4ef;"></i> Đăng nhập với Microsoft
            </a>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('auth-status');

        // ĐÃ SỬA THEO YÊU CẦU CỦA TÚ: Đoạn code bắt token từ Microsoft
        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token');
            
            if (idToken) {
                // Lưu token vào localStorage
                localStorage.setItem('ms_token', idToken);
                
                // Giao diện: Ẩn các form đi và báo thành công
                document.getElementById('tabs-container').style.display = 'none';
                document.querySelectorAll('.form-container').forEach(f => f.style.display = 'none');
                document.getElementById('social-login').style.display = 'none';
                
                statusText.style.color = "#16a34a";
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đăng nhập Microsoft thành công! Đang vào hệ thống...';
                
                // chuyển hướng sang trang chủ sau 1.5 giây
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        };

        // Hàm chuyển đổi tab giao diện
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            statusText.innerText = "";

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // Quay lại bước 1 nếu nhập sai OTP
        function backToLoginStep1() {
            document.getElementById('login-step-2').style.display = 'none';
            document.getElementById('login-step-1').style.display = 'block';
            document.getElementById('tabs-container').style.display = 'flex';
            document.getElementById('social-login').style.display = 'block';
            statusText.innerText = "";
        }

        // ---------------------------------------------------------
        // QUY TRÌNH 1: KIỂM TRA MẬT KHẨU (API GIANG) + GỬI OTP (API LÂM)
        // ---------------------------------------------------------
        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Vui lòng nhập đầy đủ email và mật khẩu!";
                return;
            }

            statusText.style.color = "#2563eb";
            statusText.innerText = "Đang kiểm tra Database Azure... ⏳";
            document.getElementById('btn-login').disabled = true;

            const dbEndpoint = 'https://api-giang-dmfrcsbde0erf8d9.southeastasia-01.azurewebsites.net/api/login';

            // GỌI API CỦA GIANG ĐỂ CHECK MẬT KHẨU
            fetch(dbEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, time: new Date().toISOString() })
            })
            .then(res => res.text()) 
            .then(data => {
                // NẾU GIANG BÁO ĐÚNG MẬT KHẨU -> GỌI API LÂM GỬI OTP
                triggerOTPFlow(email);
            })
            .catch(err => {
                console.warn("Lỗi DB Giang:", err);
                // Giữ nguyên tính năng Demo của ông nếu API Giang đang tắt
                triggerOTPFlow(email);
            });
        });

        // HÀM GỌI API CỦA LÂM ĐỂ BẮN EMAIL OTP
        async function triggerOTPFlow(email) {
            statusText.innerText = "Mật khẩu đúng! Đang gửi mã OTP bảo mật... ⏳";
            
            try {
                const response = await fetch("https://api-chatbot-lam-2026-cqa6fdcdg5f9b0h2.southeastasia-01.azurewebsites.net/api/send-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    statusText.innerText = "";
                    // Ẩn bước 1, Hiện bước 2
                    document.getElementById('login-step-1').style.display = 'none';
                    document.getElementById('tabs-container').style.display = 'none';
                    document.getElementById('social-login').style.display = 'none';
                    document.getElementById('login-step-2').style.display = 'block';
                } else {
                    statusText.style.color = "#dc2626";
                    statusText.innerText = "Lỗi hệ thống gửi mail của Azure!";
                }
            } catch (error) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Lỗi kết nối tới Server OTP!";
            } finally {
                document.getElementById('btn-login').disabled = false;
            }
        }

        // ---------------------------------------------------------
        // QUY TRÌNH 2: XÁC THỰC MÃ OTP (API LÂM) ĐỂ VÀO WEB
        // ---------------------------------------------------------
        document.getElementById('btn-verify-otp').addEventListener('click', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const otp = document.getElementById('login-otp').value.trim();
            const btnVerify = document.getElementById('btn-verify-otp');

            if (!otp || otp.length < 6) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Vui lòng nhập đủ 6 số OTP!";
                return;
            }

            btnVerify.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';
            btnVerify.disabled = true;

            try {
                const response = await fetch("https://api-chatbot-lam-2026-cqa6fdcdg5f9b0h2.southeastasia-01.azurewebsites.net/api/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                if (response.ok) {
                    statusText.style.color = "#16a34a";
                    statusText.innerText = "Đăng nhập thành công! Đang chuyển hướng... ✅";
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    statusText.style.color = "#dc2626";
                    statusText.innerText = "Mã OTP không chính xác hoặc đã hết hạn!";
                }
            } catch (error) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Lỗi kết nối tới Server OTP!";
            } finally {
                btnVerify.innerHTML = '<i class="fa-solid fa-unlock"></i> Xác nhận OTP';
                btnVerify.disabled = false;
            }
        });

        // ---------------------------------------------------------
        // ĐĂNG KÝ (API GIANG - GIỮ NGUYÊN)
        // ---------------------------------------------------------
        document.getElementById('btn-register').addEventListener('click', function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!name || !email || !password) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Vui lòng điền đầy đủ thông tin đăng ký!";
                return;
            }

            statusText.style.color = "#2563eb";
            statusText.innerText = "Đang lưu tài khoản lên Database Azure... ⏳";

            const registerEndpoint = 'https://api-giang-dmfrcsbde0erf8d9.southeastasia-01.azurewebsites.net/api/login';

            fetch(registerEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password, type: 'register', time: new Date().toISOString() })
            })
            .then(res => res.text())
            .then(data => {
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng ký tài khoản thành công! 🎉 Hãy chuyển sang tab Đăng Nhập.";
            })
            .catch(err => {
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng ký thành công và lưu lên Azure thành công! 🎉";
            });
        });
    </script>
</body>
</html>
