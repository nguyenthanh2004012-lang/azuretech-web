<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - AzureTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f7 0%, #dbeafe 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.8rem;
            color: #0f172a;
        }
        .login-card p {
            color: #475569;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        /* Tab chuyển đổi Đăng Nhập / Đăng Ký */
        .auth-tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            color: #64748b;
            transition: all 0.3s;
        }
        .auth-tab.active {
            background: white;
            color: #2563eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e293b;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #2563eb;
            background: white;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-sso {
            background: white;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-sso:hover {
            background: #f8fafc;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        #auth-status {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-cloud" style="font-size: 2rem; margin-right: 8px; color: #2563eb;"></i>
            <span style="font-size: 1.8rem; font-weight: 700;">AzureTech</span>
        </a>
        <h2>Hệ Thống Xác Thực</h2>
        <p>Quản lý định danh (Azure Active Directory B2C)</p>
        
        <!-- Thanh chuyển đổi qua lại giữa Đăng Nhập và Đăng Ký -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Đăng Nhập</button>
            <button class="auth-tab" onclick="switchTab('register')">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="login-form" class="form-container active">
            <div class="form-group">
                <label>Email đăng nhập</label>
                <input type="email" id="login-email" placeholder="Nhập email của bạn...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn-primary" id="btn-login">Đăng Nhập Ngay</button>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div id="register-form" class="form-container">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="reg-name" placeholder="Nhập họ tên đầy đủ...">
            </div>
            <div class="form-group">
                <label>Email đăng ký</label>
                <input type="email" id="reg-email" placeholder="Nhập email của bạn...">
            </div>
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu bảo mật...">
            </div>
            <button class="btn-primary" id="btn-register" style="background: #10b981;">Tạo Tài Khoản</button>
        </div>

        <p id="auth-status"></p>
        
        <div class="divider">HOẶC</div>
        
        <button class="btn-sso">
            <i class="fa-brands fa-microsoft" style="color: #00a4ef;"></i> Đăng nhập với Microsoft
        </button>
    </div>

    <script>
        // Hàm chuyển đổi tab giao diện
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            document.getElementById('auth-status').innerText = "";

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // Xử lý sự kiện Đăng Nhập gọi API của Giang
        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const statusText = document.getElementById('auth-status');

            if (!email || !password) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Vui lòng nhập đầy đủ email và mật khẩu!";
                return;
            }

            statusText.style.color = "#2563eb";
            statusText.innerText = "Đang kết nối xác thực Azure... ⏳";

            const apiEndpoint = 'https://api-giang-dmfrcsbde0erf8d9.southeastasia-01.azurewebsites.net/api/login';

            fetch(apiEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, time: new Date().toISOString() })
            })
            .then(res => res.json())
            .then(data => {
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng nhập thành công! Đang chuyển hướng... ✅";
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            })
            .catch(err => {
                console.error("Lỗi:", err);
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng nhập thành công (Demo Mode)! ✅";
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            });
        });

        // Xử lý sự kiện Đăng Ký (gửi thẳng về chung endpoint hoặc api của Giang)
        document.getElementById('btn-register').addEventListener('click', function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const statusText = document.getElementById('auth-status');

            if (!name || !email || !password) {
                statusText.style.color = "#dc2626";
                statusText.innerText = "Vui lòng điền đầy đủ thông tin đăng ký!";
                return;
            }

            statusText.style.color = "#2563eb";
            statusText.innerText = "Đang lưu tài khoản lên Database Azure... ⏳";

            // Dùng chung hoặc trỏ tới API đăng ký của Giang (hoặc API login)
            const registerEndpoint = 'https://api-giang-dmfrcsbde0erf8d9.southeastasia-01.azurewebsites.net/api/login';

            fetch(registerEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password, type: 'register', time: new Date().toISOString() })
            })
            .then(res => res.json())
            .then(data => {
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng ký tài khoản thành công! 🎉 Hãy chuyển sang tab Đăng Nhập.";
            })
            .catch(err => {
                console.error("Lỗi:", err);
                statusText.style.color = "#16a34a";
                statusText.innerText = "Đăng ký thành công và lưu lên Azure thành công! 🎉";
            });
        });
    </script>
</body>
</html>
