<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - AzureTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f5f7 0%, #e0e7ff 100%);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: var(--secondary);
        }
        .btn-sso {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-sso:hover {
            background: #f9f9f9;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>
    
    <div class="login-card">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 20px;">
            <i class="fa-solid fa-cloud" style="font-size: 2rem;"></i>
            <span style="font-size: 1.8rem;">AzureTech</span>
        </a>
        <h2>Đăng Nhập</h2>
        <p>Hệ thống quản lý định danh (Azure Active Directory B2C)</p>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Nhập email...">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" placeholder="Nhập mật khẩu...">
        </div>
        
        <button class="btn-primary" style="width: 100%; padding: 14px; border-radius: 12px; border:none;" onclick="window.location.href='index.html'">Đăng Nhập</button>
        
        <div class="divider">HOẶC</div>
        
        <button class="btn-sso">
            <i class="fa-brands fa-microsoft" style="color: #00a4ef;"></i> Đăng nhập với Microsoft
        </button>
    </div>

</body>
</html>
